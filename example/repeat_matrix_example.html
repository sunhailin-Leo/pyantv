<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Awesome-pyantv</title>
                <script type="text/javascript" src="https://unpkg.com/@antv/g2/dist/g2.min.js"></script>

    
</head>
<body >
    <div id="a17579ee4a014a4683b4a5015876d514" class="chart-container" style="width:320px; height:720px; "></div>
    <script>
        const antv_chart_a17579ee4a014a4683b4a5015876d514 = new G2.Chart({"container": "a17579ee4a014a4683b4a5015876d514", "autoFit": true, "paddingLeft": 50, "paddingBottom": 60});
        antv_chart_a17579ee4a014a4683b4a5015876d514.options({
    "type": "repeatMatrix",
    "data": {
        "type": "fetch",
        "value": "https://assets.antv.antgroup.com/g2/weather.json",
        "transform": [
            {
                "type": "map",
                "callback": ({ date, ...d }) => ({...d, date: new Date(date).getMonth() + ''})

        ]
    },
    "encode": {
        "x": "date",
        "y": [
            "temp_max",
            "precipitation",
            "wind"
        ]
    },
    "children": [
        {
            "type": "line",
            "encode": {
                "color": "location"
            },
            "transform": [
                {
                    "type": "groupX",
                    "y": "mean"
                }
            ],
            "scale": {
                "y": {
                    "zero": true
                }
            }
        }
    ]
});
        antv_chart_a17579ee4a014a4683b4a5015876d514.render();
    </script>
</body>
</html>
