<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Awesome-pyantv</title>
                <script type="text/javascript" src="https://unpkg.com/@antv/g2/dist/g2.min.js"></script>

    
</head>
<body >
    <div id="5cb71ec230ba41f49d4c9d3e7139b758" class="chart-container" style="width:900px; height:500px; "></div>
    <script>
        const antv_chart_5cb71ec230ba41f49d4c9d3e7139b758 = new G2.Chart({"container": "5cb71ec230ba41f49d4c9d3e7139b758"});
        antv_chart_5cb71ec230ba41f49d4c9d3e7139b758.options({
    "type": "view",
    "data": {
        "type": "fetch",
        "value": "https://assets.antv.antgroup.com/g2/year-population.json"
    },
    "children": [
        {
            "type": "rangeX",
            "data": [
                {
                    "year": [
                        new Date('1933'),
                        new Date('1945')
                    ],
                    "event": "Nazi Rule"
                },
                {
                    "year": [
                        new Date('1948'),
                        new Date('1989')
                    ],
                    "event": "GDR (East Germany)"
                }
            ],
            "encode": {
                "x": "year",
                "color": "event"
            },
            "scale": {
                "color": {
                    "independent": true,
                    "range": [
                        "#FAAD14",
                        "#30BF78"
                    ]
                }
            },
            "style": {
                "fillOpacity": 0.75
            }
        },
        {
            "type": "line",
            "encode": {
                "x": (d) => new Date(d.year),
                "y": "population",
                "color": "#333"
            }
        },
        {
            "type": "point",
            "encode": {
                "x": (d) => new Date(d.year),
                "y": "population",
                "color": "#333"
            },
            "style": {
                "lineWidth": 1.5
            }
        }
    ]
});
        antv_chart_5cb71ec230ba41f49d4c9d3e7139b758.render();
    </script>
</body>
</html>
