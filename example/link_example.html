<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Awesome-pyantv</title>
                <script type="text/javascript" src="https://unpkg.com/@antv/g2/dist/g2.min.js"></script>

    
</head>
<body >
    <div id="a93a5b50eb1942378f08273a9a2199fc" class="chart-container" style="width:900px; height:500px; "></div>
    <script>
        const antv_chart_a93a5b50eb1942378f08273a9a2199fc = new G2.Chart({"container": "a93a5b50eb1942378f08273a9a2199fc"});
        antv_chart_a93a5b50eb1942378f08273a9a2199fc.options({
    "type": "view",
    "data": {
        "type": "fetch",
        "value": "https://assets.antv.antgroup.com/g2/aapl2.json",
        "transform": [
            {
                "type": "map",
                "callback": (d) => ({...d, Date: new Date(d.Date)})
            }
        ]
    },
    "children": [
        {
            "type": "link",
            "encode": {
                "x": "Date",
                "y": [
                    "Low",
                    "High"
                ],
                "color": (d) => Math.sign(d.Close - d.Open)
            },
            "style": {
                "stroke": "black"
            },
            "tooltip": {
                "title": (d) => d.Date.toLocaleString(),
                "items": [
                    {
                        "field": "Low",
                        "name": "low"
                    },
                    {
                        "field": "High",
                        "name": "high"
                    }
                ]
            }
        },
        {
            "type": "link",
            "encode": {
                "x": "Date",
                "y": [
                    "Open",
                    "Close"
                ],
                "color": (d) => Math.sign(d.Close - d.Open)
            },
            "style": {
                "fillOpacity": 1,
                "lineWidth": 4,
                "lineCap": "round,",
                "radius": 2
            },
            "tooltip": {
                "items": [
                    {
                        "field": "Open",
                        "name": "open"
                    },
                    {
                        "field": "Close",
                        "name": "close"
                    }
                ]
            }
        }
    ],
    "scale": {
        "color": {
            "type": "ordinal",
            "domain": [
                1,
                0,
                -1
            ],
            "range": [
                "#4daf4a",
                "#999999",
                "#e41a1c"
            ]
        }
    },
    "interaction": {
        "tooltip": {
            "shared": true,
            "groupName": false
        }
    }
});
        antv_chart_a93a5b50eb1942378f08273a9a2199fc.render();
    </script>
</body>
</html>
