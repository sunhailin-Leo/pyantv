<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Awesome-pyantv</title>
                <script type="text/javascript" src="https://unpkg.com/@antv/g2/dist/g2.min.js"></script>

    
</head>
<body >
    <div id="f9d7d947ab5249e1b98f896ec5eb98ad" class="chart-container" style="width:900px; height:500px; "></div>
    <script>
        const antv_chart_f9d7d947ab5249e1b98f896ec5eb98ad = new G2.Chart({"container": "f9d7d947ab5249e1b98f896ec5eb98ad"});
        antv_chart_f9d7d947ab5249e1b98f896ec5eb98ad.options({
    "type": "view",
    "data": [
        {
            "name": "Internet Explorer",
            "value": 26,
            "url": "https://gw.alipayobjects.com/zos/rmsportal/eOYRaLPOmkieVvjyjTzM.png"
        },
        {
            "name": "Chrome",
            "value": 40,
            "url": "https://gw.alipayobjects.com/zos/rmsportal/dWJWRLWfpOEbwCyxmZwu.png"
        },
        {
            "name": "Firefox",
            "value": 30,
            "url": "https://gw.alipayobjects.com/zos/rmsportal/ZEPeDluKmAoTioCABBTc.png"
        },
        {
            "name": "Safari",
            "value": 24,
            "url": "https://gw.alipayobjects.com/zos/rmsportal/eZYhlLzqWLAYwOHQAXmc.png"
        },
        {
            "name": "Opera",
            "value": 15,
            "url": "https://gw.alipayobjects.com/zos/rmsportal/vXiGOWCGZNKuVVpVYQAw.png"
        },
        {
            "name": "Undetectable",
            "value": 8,
            "url": "https://gw.alipayobjects.com/zos/rmsportal/NjApYXminrnhBgOXyuaK.png"
        }
    ],
    "children": [
        {
            "type": "link",
            "encode": {
                "x": [
                    "name",
                    "name"
                ],
                "y": (d) => [0, d.value]
            },
            "style": {
                "stroke": "#dfdfdf",
                "lineDash": [
                    2,
                    2
                ]
            }
        },
        {
            "type": "line",
            "encode": {
                "x": "name",
                "y": "value",
                "shape": "smooth"
            },
            "scale": {
                "x": {
                    "type": "band"
                },
                "y": {
                    "type": "linear",
                    "domain": [
                        0,
                        50
                    ]
                }
            },
            "style": {
                "opacity": 0.5
            }
        },
        {
            "type": "image",
            "encode": {
                "x": "name",
                "y": "value",
                "src": "url"
            },
            "scale": {
                "x": {
                    "type": "band"
                },
                "y": {
                    "type": "linear",
                    "domain": [
                        0,
                        50
                    ]
                }
            }
        }
    ]
});
        antv_chart_f9d7d947ab5249e1b98f896ec5eb98ad.render();
    </script>
</body>
</html>
