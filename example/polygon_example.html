<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Awesome-pyantv</title>
                <script type="text/javascript" src="https://unpkg.com/@antv/g2/dist/g2.min.js"></script>
            <script type="text/javascript" src="https://unpkg.com/@antv/data-set@0.11.8/dist/data-set.js"></script>

    
</head>
<body >
    <div id="d2dff523c17a4c32b7a830c871fe3d52" class="chart-container" style="width:900px; height:500px; "></div>
    <script>
        const antv_chart_d2dff523c17a4c32b7a830c871fe3d52 = new G2.Chart({"container": "d2dff523c17a4c32b7a830c871fe3d52"});
        antv_chart_d2dff523c17a4c32b7a830c871fe3d52.options({
    "type": "polygon",
    "data": {
        "type": "fetch",
        "value": "https://assets.antv.antgroup.com/g2/hexbin-china.json",
        "transform": [
            {
                "type": "custom",
                "callback": (data) => {  const dv = new DataSet.View().source(data).transform({    type: 'bin.hexagon',    fields: ['longitude', 'latitude'],    binWidth: [2, 3],    as: ['longitude', 'latitude', 'count'],  });  return dv.rows;}
            }
        ]
    },
    "encode": {
        "x": "longitude",
        "y": "latitude",
        "color": "count"
    },
    "scale": {
        "color": {
            "range": "#BAE7FF-#1890FF-#0050B3"
        }
    },
    "style": {
        "stroke": "#fff",
        "lineWidth": 5
    },
    "state": {
        "active": {
            "fill": "orange"
        },
        "inactive": {
            "opacity": 0.8
        }
    },
    "interaction": {
        "elementHighlight": true
    },
    "axis": false,
    "legend": false,
    "tooltip": {
        "items": [
            {
                "field": "count"
            }
        ]
    }
});
        antv_chart_d2dff523c17a4c32b7a830c871fe3d52.render();
    </script>
</body>
</html>
