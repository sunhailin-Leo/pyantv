name: pyantv CI

on: [push, pull_request]

# CI 策略（Sprint 62）：
# - uv 视为必装依赖，不提供 pip fallback job（本地开发者可继续使用 pip）
# - 所有依赖通过 `pip install uv && uv sync --dev --extra all` 安装
# - 构建通过 `python -m build`（PEP 517），产物在隔离环境中验证

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install uv and sync dev extras
      run: |
        python -m pip install --upgrade pip
        pip install uv
        uv sync --dev --extra all
    - name: Run lint
      run: uv run make lint

  docs:
    # 文档构建校验（Sprint 73+）：strict 模式下任何死链、未引用文件、Markdown 解析告警
    # 都会让 CI 失败，从而避免文档与实际代码不一致的问题再次出现。
    needs: lint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install uv and sync docs extras
      run: |
        python -m pip install --upgrade pip
        pip install uv
        uv sync --extra docs
    - name: Build MkDocs site (strict)
      run: uv run mkdocs build --strict --site-dir site

  build:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install uv and sync dev + test + all extras
      run: |
        python -m pip install --upgrade pip
        pip install uv
        uv sync --dev --extra all --extra test
    - name: Build sdist + wheel (PEP 517)
      run: uv run python -m build
    - name: Run unit tests with coverage
      run: uv run pytest -v --cov-config=.coveragerc --cov=./ --cov-fail-under=95 test/
    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
